[project]
name = "olist-data-ai-platform"
version = "1.0.0"
description = "Local-first end-to-end Data & AI portfolio platform using Olist e-commerce data."
requires-python = ">=3.12"
authors = [
  { name = "Rodrigo Terra" }
]

dependencies = [
  "duckdb",
  "fastapi",
  "joblib",
  "mlflow",
  "numpy",
  "pandas",
  "pyarrow",
  "scikit-learn",
  "streamlit",
  "uvicorn[standard]",
  "xgboost",
]

[project.optional-dependencies]
dev = [
  "httpx2",
  "pytest",
  "ruff",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = [
  "tests",
  "api/tests",
  "ml/tests",
  "agent/tests",
  "synthetic_data/tests",
]
