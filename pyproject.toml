[project]
name = "olist-data-ai-platform"
version = "0.1.0"
description = "Local-first end-to-end Data & AI portfolio platform using Olist data."
requires-python = ">=3.12"
authors = [
  { name = "Rodrigo Terra" }
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests", "api/tests", "ml/tests", "agent/tests", "synthetic_data/tests"]
