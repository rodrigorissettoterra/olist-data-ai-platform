name: olist-data-ai-platform

services:
  postgres:
    image: postgres:17.11-bookworm
    container_name: olist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ${OLIST_WAREHOUSE_DB}
      TZ: ${TZ:-UTC}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_ADMIN_USER} -d ${OLIST_WAREHOUSE_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - olist_backend

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: olist-garage
    restart: unless-stopped
    command:
      - /garage
      - server
      - --single-node
      - --default-bucket
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_PIPELINE_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_PIPELINE_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET_RAW}
      RUST_LOG: garage=info
    ports:
      - "127.0.0.1:${GARAGE_S3_PORT:-3900}:3900"
    volumes:
      - ./infrastructure/garage/config/garage.toml:/etc/garage.toml:ro
      - garage_metadata:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    networks:
      - olist_backend

networks:
  olist_backend:
    name: olist_backend
    driver: bridge

volumes:
  postgres_data:
    name: olist_postgres_data
  garage_metadata:
    name: olist_garage_metadata
  garage_data:
    name: olist_garage_data
